<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
 <title>Blamdom Launcher</title>
 <defs>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#7cf093"/>
   <stop offset="1" stop-color="#3fbf58"/>
  </linearGradient>
 </defs>
 <!-- left face (dirt) -->
 <polygon points="19,38 64,64 64,116 19,90" fill="#7a4f2b"/>
 <!-- right face (darker dirt) -->
 <polygon points="64,64 109,38 109,90 64,116" fill="#5f3c20"/>
 <!-- grass overhang on both side faces -->
 <polygon points="19,38 64,64 64,80 19,54" fill="#3fbf58"/>
 <polygon points="64,64 109,38 109,54 64,80" fill="#2e9b45"/>
 <!-- dirt specks -->
 <polygon points="28,70 36,74.6 36,80.6 28,76" fill="#8f5f36"/>
 <polygon points="44,88 52,92.6 52,98.6 44,94" fill="#6a4423"/>
 <polygon points="80,88 88,83.4 88,89.4 80,94" fill="#4c2f19"/>
 <polygon points="94,66 100,62.5 100,68.5 94,72" fill="#74482a"/>
 <!-- top face -->
 <polygon points="64,12 109,38 64,64 19,38" fill="url(#top)"/>
 <polygon points="64,20 94,37.3 64,54.6 34,37.3" fill="#ffffff" fill-opacity="0.12"/>
 <!-- subtle edges -->
 <polyline points="19,38 64,64 109,38" fill="none" stroke="#0a0e14" stroke-opacity="0.35" stroke-width="1.2"/>
 <line x1="64" y1="64" x2="64" y2="116" stroke="#0a0e14" stroke-opacity="0.35" stroke-width="1.2"/>
</svg>
