name: build

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:

# releases are created with the workflow's own token
permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the tag matches the launcher version (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The updater compares the release tag with the version baked into the binary.
          # A mismatch means every user is told to update forever, or never. Fail early.
          V=$(grep -E '^set\(Launcher_VERSION_(MAJOR|MINOR|PATCH) ' CMakeLists.txt | sed -E 's/.* ([0-9]+)\)$/\1/' | paste -sd.)
          TAG="${GITHUB_REF_NAME#v}"
          echo "CMake version: $V   tag: $TAG"
          if [ "$V" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Launcher_VERSION in CMakeLists.txt ($V). Bump it first."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkgconf extra-cmake-modules \
            python3-venv python3-pip \
            libcmark-dev cmark libqrencode-dev libarchive-dev libtomlplusplus-dev \
            zlib1g-dev libxkbcommon-dev libfontconfig1-dev libgl1-mesa-dev libegl-dev \
            libglib2.0-dev libdbus-1-dev gamemode-dev default-jdk-headless \
            xvfb patchelf \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-xinput0 libxcb-cursor0 libxcb-xinerama0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-util1 libxcb-sync1 libxcb-glx0 libxcb-present0 libxcb-dri3-0 libxcb-shm0

      - name: Install Qt 6.9.3 (aqt)
        run: |
          python3 -m venv ~/.aqtvenv
          ~/.aqtvenv/bin/pip install aqtinstall
          # Qt 6.9: qtbase is the base package (always installed, not a module);
          # qttools doesn't exist as a module. Only qtnetworkauth is an actual
          # module Prism links.
          ~/.aqtvenv/bin/aqt install-qt linux desktop 6.9.3 linux_gcc_64 \
            -m qtnetworkauth -O /opt/qt

      - name: Updater self-test (version logic, checksum, extract, swap + rollback)
        run: |
          export PATH=/opt/qt/6.9.3/gcc_64/bin:$PATH
          cmake -S tests/blamdom-updater -B /tmp/updater-selftest -G Ninja -DCMAKE_PREFIX_PATH=/opt/qt/6.9.3/gcc_64
          cmake --build /tmp/updater-selftest
          QT_QPA_PLATFORM=offscreen /tmp/updater-selftest/selftest

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=/opt/qt/6.9.3/gcc_64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Build
        run: |
          ninja -C build prismlauncher
          # The Java jars (JavaCheck, NewLaunch) are separate targets; without
          # them the launcher cannot detect installed Java or launch the game.
          ninja -C build JavaCheck NewLaunch NewLaunchLegacy
          ls -la build/jars

      - name: Bundle with linuxdeployqt
        run: |
          # (PATH is exported in-run, not via env: — $PATH is not shell-expanded
          # in the env block, which would drop /usr/bin and break git below)
          export PATH=/opt/qt/6.9.3/gcc_64/bin:$PATH
          # The stock linuxdeployqt AppImage refuses to run on glibc > 2.35
          # (ubuntu-24.04 runners are 2.39), so build it from source and use
          # the escape hatch. Safe here: the runner is disposable.
          git clone --depth 1 https://github.com/probonopd/linuxdeployqt /tmp/ldq
          cd /tmp/ldq
          git tag -f localbuild
          cmake -B build -G Ninja -DCMAKE_PREFIX_PATH=/opt/qt/6.9.3/gcc_64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          # back to the workspace: the rest of this script uses workspace-relative paths
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist/blamdom-launcher-linux-x86_64
          cp build/prismlauncher dist/blamdom-launcher-linux-x86_64/blamdom-launcher
          cp program_info/blamdom-launcher-256.png dist/blamdom-launcher-linux-x86_64/blamdom-launcher.png  # icon for the desktop entry
          # The Java jars live next to the binary in jars/ (Application::getJarPath
          # looks there); JavaCheck powers Java detection, NewLaunch the launch.
          mkdir -p dist/blamdom-launcher-linux-x86_64/jars
          cp build/jars/*.jar dist/blamdom-launcher-linux-x86_64/jars/
          /tmp/ldq/build/tools/linuxdeployqt/linuxdeployqt \
            dist/blamdom-launcher-linux-x86_64/blamdom-launcher \
            -bundle-non-qt-libs -unsupported-allow-new-glibc
          # Sanity: the self-contained bundle must boot
          xvfb-run -a dist/blamdom-launcher-linux-x86_64/blamdom-launcher --version
          tar -czf blamdom-launcher-linux-x86_64.tar.gz -C dist blamdom-launcher-linux-x86_64
          # The in-app updater verifies the download against this file
          sha256sum blamdom-launcher-linux-x86_64.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blamdom-launcher-linux-x86_64
          path: |
            blamdom-launcher-linux-x86_64.tar.gz
            SHA256SUMS

      # Release publishing happens in the `publish` job below, which waits
      # for the Windows build too — one release with both platform files.

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the tag matches the launcher version (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V=$(grep -E '^set\(Launcher_VERSION_(MAJOR|MINOR|PATCH) ' CMakeLists.txt \
               | sed -E 's/^[^(]*\(([^ ]+) ([0-9]+)\)/\2/' | paste -sd.)
          T=${GITHUB_REF_NAME#v}
          [ "$V" = "$T" ] || { echo "::error::tag $T != version $V (bump CMakeLists.txt Launcher_VERSION)"; exit 1; }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Enter MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt 6.9.3 (aqt)
        shell: bash
        run: |
          python -m venv aqt
          aqt/Scripts/pip install --quiet aqtinstall
          aqt/Scripts/aqt install-qt windows desktop 6.9.3 win64_msvc2022_64 -m qtnetworkauth -O "$HOME/qt"
          ls "$HOME/qt/6.9.3/msvc2022_64/lib/cmake/Qt6" | head -3

      - name: Configure
        shell: bash
        run: |
          VCPKG="${VCPKG_INSTALLATION_ROOT:-D:/vcpkg}"
          cmake -B build -G "Ninja Multi-Config" \
            -DCMAKE_PREFIX_PATH="$HOME/qt/6.9.3/msvc2022_64" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG/scripts/buildsystems/vcpkg.cmake"
          ninja -C build --version

      - name: Build
        shell: bash
        run: |
          # The CMake target is BlamdomLauncher (prismlauncher is only the output file name)
          # BlamdomLauncher_filelink is a small Windows helper the install rules also expect
          cmake --build build --config Release --target BlamdomLauncher --target BlamdomLauncher_filelink --target JavaCheck --target NewLaunch --target NewLaunchLegacy
          find build -name "*.jar"

      - name: Bundle (portable)
        shell: bash
        run: |
          # cmake --install brings the exe, the jars/, the Qt DLLs + plugins
          # (qt_deploy_runtime_dependencies) and the vcpkg dependency DLLs.
          cmake --install build --config Release --prefix dist/blamdom-launcher-windows-x64
          # Brand the executable (the updater and docs refer to blamdom-launcher.exe)
          mv dist/blamdom-launcher-windows-x64/prismlauncher.exe dist/blamdom-launcher-windows-x64/blamdom-launcher.exe
          # Sanity: exe, jars and some DLLs must all be present
          test -s dist/blamdom-launcher-windows-x64/blamdom-launcher.exe
          test -s dist/blamdom-launcher-windows-x64/prismlauncher_filelink.exe
          test -s dist/blamdom-launcher-windows-x64/jars/JavaCheck.jar
          ls dist/blamdom-launcher-windows-x64
          find dist/blamdom-launcher-windows-x64 -name "*.dll" | wc -l

      - name: Package
        shell: bash
        run: |
          powershell -Command "Compress-Archive -Path 'dist/blamdom-launcher-windows-x64' -DestinationPath 'blamdom-launcher-windows-x64.zip' -Force"
          sha256sum blamdom-launcher-windows-x64.zip > SHA256SUMS
          cat SHA256SUMS
          ls -la blamdom-launcher-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blamdom-launcher-windows-x64
          path: |
            blamdom-launcher-windows-x64.zip
            SHA256SUMS

  publish:
    name: Publish release (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Merge checksums
        run: |
          cat release/blamdom-launcher-linux-x86_64/SHA256SUMS \
              release/blamdom-launcher-windows-x64/SHA256SUMS > release/SHA256SUMS
          cat release/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/blamdom-launcher-linux-x86_64/blamdom-launcher-linux-x86_64.tar.gz
            release/blamdom-launcher-windows-x64/blamdom-launcher-windows-x64.zip
            release/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
